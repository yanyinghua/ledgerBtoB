{% extends 'books/base.html' %}
{% block title %}等待授权{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h4 class="card-title">账号待授权</h4>
          <p class="text-muted">您的账号 <strong>{{ user.username }}</strong> 已注册成功，当前为「待授权」状态。</p>
          <p class="text-muted">请联系管理员为您的账号分配角色与数据范围后，方可使用系统功能。</p>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary">退出登录</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
