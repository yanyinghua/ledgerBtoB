{% extends 'books/base.html' %}
{% block title %}首页 - 店铺往来账{% endblock %}
{% block content %}
<div class="row g-3 mb-4">
  <div class="col-6 col-md-3">
    <div class="card text-bg-primary shadow-sm"><div class="card-body">
      <div class="small">当前角色</div><div class="fs-4">{{ role|default:'—' }}</div>
    </div></div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card text-bg-secondary shadow-sm"><div class="card-body">
      <div class="small">主表记录数</div><div class="fs-4">{{ record_count }}</div>
    </div></div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card text-bg-info shadow-sm"><div class="card-body">
      <div class="small">往来单位数</div><div class="fs-4">{{ unit_count }}</div>
    </div></div>
  </div>
</div>

<h5>快捷入口</h5>
<div class="row row-cols-2 row-cols-md-4 g-3">
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_ledger_list' %}">往来明细 / 订单检索</a></div>
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_receipt_list' %}">回款管理</a></div>
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_collection' %}">业务员催款</a></div>
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_aging' %}">账期管理</a></div>
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_statements' %}">对账单</a></div>
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_invoice_list' %}">店铺开票记录</a></div>
  <div class="col"><a class="btn btn-outline-primary w-100 py-3" href="{% url 'shop_registry_list' %}">店铺工商字典</a></div>
  {% if is_exec_or_admin %}
  <div class="col"><a class="btn btn-outline-secondary w-100 py-3" href="{% url 'admin_authorize' %}">用户授权</a></div>
  {% endif %}
</div>
{% endblock %}
