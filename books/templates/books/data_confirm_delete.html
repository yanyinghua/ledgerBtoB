{% extends 'books/base.html' %}
{% block title %}删除确认 - 往来账管理系统{% endblock %}
{% block content %}
<h5>删除确认</h5>
<div class="card shadow-sm" style="max-width:520px">
  <div class="card-body">
    <p>确认删除：<b>{{ object }}</b>？此操作不可恢复。</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">确认删除</button>
      <a class="btn btn-outline-secondary" href="{% url back %}">取消</a>
    </form>
  </div>
</div>
{% endblock %}
