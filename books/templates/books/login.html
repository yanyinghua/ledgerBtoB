{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 往来账管理系统</title>
  <link href="{% static 'books/vendor/bootstrap.min.css' %}" rel="stylesheet">
  <style>
    body { background: #f5f6f8; }
    .login-card { max-width: 380px; margin: 8vh auto; }
  </style>
</head>
<body>
<div class="container">
  <div class="card login-card shadow-sm">
    <div class="card-body">
      <h4 class="card-title text-center mb-4">往来账管理系统</h4>
      {% if form.errors %}<div class="alert alert-danger">用户名或密码错误。</div>{% endif %}
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">登录</button>
      </form>
      <div class="d-grid gap-2 mt-3">
        <a href="{% url 'phone_login' %}" class="btn btn-outline-primary btn-sm">手机验证码登录</a>
        <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-sm">注册（需邀请）</a>
      </div>
      <p class="text-muted small mt-3 mb-0">角色：管理员 / 高层 / 部门 / 业务员 / 商户</p>
    </div>
  </div>
</div>
<script src="{% static 'books/vendor/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
