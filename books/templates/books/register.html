{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 - B2B往来账系统</title>
  <link href="{% static 'books/vendor/bootstrap.min.css' %}" rel="stylesheet">
  <style>
    body { background: #f5f6f8; }
    .login-card { max-width: 380px; margin: 8vh auto; }
  </style>
</head>
<body>
<div class="container">
  <div class="card login-card shadow-sm">
    <div class="card-body">
      <h4 class="card-title text-center mb-4">账号注册</h4>
      {% if messages %}
        {% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}
      {% endif %}
      <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">手机号</label>
          <input type="tel" name="phone" class="form-control" value="{{ phone|default:'' }}" placeholder="仅邀请名单内手机号可注册" required {% if step == 'confirm' %}readonly{% endif %}>
        </div>
        {% if step == 'confirm' %}
        <div class="mb-3">
          <label class="form-label">验证码</label>
          <input type="text" name="code" class="form-control" maxlength="6" placeholder="6 位验证码" required>
        </div>
        <button type="submit" name="action" value="confirm" class="btn btn-primary w-100">完成注册</button>
        {% else %}
        <button type="submit" name="action" value="send" class="btn btn-primary w-100">获取验证码</button>
        {% endif %}
      </form>
      <div class="d-grid mt-3">
        <a href="{% url 'login' %}" class="btn btn-link btn-sm">已有账号？去登录</a>
      </div>
      <p class="text-muted small mt-2 mb-0">注册后为「待授权」状态，需管理员授权后方可使用。</p>
    </div>
  </div>
</div>
<script src="{% static 'books/vendor/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
