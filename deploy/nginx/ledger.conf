# 站点：ledger.yanyinghuaerp.top
# 放到 /etc/nginx/sites-available/ledger，再 ln -s 到 /etc/nginx/sites-enabled/
# 证书由 certbot 自动签发/续期（certbot --nginx），下方 ssl_certificate 路径为默认位置。

server {
    listen 80;
    server_name ledger.yanyinghuaerp.top;

    # Let's Encrypt 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # HTTP 全量跳转 HTTPS（Django 的 SECURE_SSL_REDIRECT 也会跳转，这里双保险）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ledger.yanyinghuaerp.top;

    ssl_certificate     /etc/letsencrypt/live/ledger.yanyinghuaerp.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.yanyinghuaerp.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS：与 DJANGO_HSTS_SECONDS 对应；开启前确认全站 HTTPS 已稳定
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Excel 导入可能较大，放宽上传上限
    client_max_body_size 20m;

    # 静态文件由 nginx 直接提供（manage.py collectstatic 收集到 staticfiles/）
    location /static/ {
        alias /srv/ledger/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 反向代理到 gunicorn unix socket
    location / {
        proxy_pass http://unix:/run/ledger/ledger.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
