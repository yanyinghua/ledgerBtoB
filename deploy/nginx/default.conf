# 全服务器兜底默认站点（多网站共用 80/443 时建议启用）
# 放到 /etc/nginx/sites-available/default，软链到 /etc/nginx/sites-enabled/。
# 作用：
#   1) 集中处理 Let's Encrypt 的 ACME 验证（所有域名的 /.well-known/acme-challenge/ 都能命中）
#   2) 对未匹配到任何 server_name 的请求（如直接用 IP 访问）直接断开，避免泄露站点
#
# 注意：整台服务器监听 80 的 default_server 只能有一个，确认其他站点配置未重复声明。

server {
    listen 80 default_server;
    # 若服务器已启用 IPv6 可取消下一行注释
    # listen [::]:80 default_server;
    server_name _;

    # certbot 验证目录（与各站点保持一致）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 无 Host 匹配 / 直接 IP 访问：直接断开
    location / {
        return 444;
    }
}
