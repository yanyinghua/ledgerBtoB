# ============================================================================
# 交付版部署：PostgreSQL + Django(gunicorn) + nginx
#
# 买方用法： ./install.sh            # 自动生成 .env 并启动
# 手动用法： cp deploy/env.docker.template .env 填好值
#            docker compose up -d --build
#
# 数据落在命名卷 pgdata，备份：docker compose exec -T db pg_dump -U ledger ledger
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 pg_isready 判断库真正可连，避免 web 先于 db 就绪导致迁移失败
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: ${POSTGRES_DB:-ledger}
      DJANGO_DB_USER: ${POSTGRES_USER:-ledger}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      TZ: Asia/Shanghai
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "443:443"   # 启用 HTTPS 时取消注释，并挂入证书
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  static_volume:
